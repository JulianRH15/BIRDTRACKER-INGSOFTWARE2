spring.application.name=BirdTracker
server.port=8080

# Base H2 embebida en archivo: persiste los registros entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/birdtracker;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Necesario para las rutas de recursos estáticos registradas por Swagger UI.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
